# Self-hosted Runner auf dem Desktop (aiex-desktop-*), nur Prüfungen; kein Veröffentlichen, kein Deployment.
name: CI
'on':
  push:
    branches:
    - main
    - master
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify
    runs-on: [self-hosted, desktop]
    timeout-minutes: 40
    env:
      ANDROID_HOME: /home/m3kky/android-sdk
      ANDROID_SDK_ROOT: /home/m3kky/android-sdk
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Run project verification
      shell: bash
      run: 'set -euo pipefail

        ./gradlew --no-daemon --max-workers=4 :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease'
